[package]
name = "linera-paper-eval"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.10.2"
csv-async = { version = "1.3.1", features = ["tokio"] }
chrono = "0.4.45"
tokio-util = "0.7.19"

linera-base = { git = "https://github.com/linera-io/linera-protocol.git", rev = "d8dd22d7e0c3363fdd6d964bccc7a92ca94238e9" }
linera-client = { git = "https://github.com/linera-io/linera-protocol.git", rev = "d8dd22d7e0c3363fdd6d964bccc7a92ca94238e9" }
linera-core = { git = "https://github.com/linera-io/linera-protocol.git", rev = "d8dd22d7e0c3363fdd6d964bccc7a92ca94238e9" }
linera-execution = { git = "https://github.com/linera-io/linera-protocol.git", rev = "d8dd22d7e0c3363fdd6d964bccc7a92ca94238e9" }
linera-storage = { git = "https://github.com/linera-io/linera-protocol.git", rev = "d8dd22d7e0c3363fdd6d964bccc7a92ca94238e9" }
linera-views = { git = "https://github.com/linera-io/linera-protocol.git", rev = "d8dd22d7e0c3363fdd6d964bccc7a92ca94238e9" }
linera-wallet-json = { git = "https://github.com/linera-io/linera-protocol.git", rev = "d8dd22d7e0c3363fdd6d964bccc7a92ca94238e9" }
linera-rpc = { git = "https://github.com/linera-io/linera-protocol.git", rev = "d8dd22d7e0c3363fdd6d964bccc7a92ca94238e9" }
linera-service = {git = "https://github.com/linera-io/linera-protocol.git", rev = "d8dd22d7e0c3363fdd6d964bccc7a92ca94238e9" }
